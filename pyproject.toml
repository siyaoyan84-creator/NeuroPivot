[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropivot"
version = "0.1.0"
description = "REFED-anchored EEG physiological representations and frozen AffectGPT residual conditioning"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[project.scripts]
neuropivot = "neuropivot.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuropivot = ["cli_schema.json"]
